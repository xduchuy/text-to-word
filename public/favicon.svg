<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Background -->
  <rect width="512" height="512" rx="112" fill="#121214"/>
  <!-- Subtle border to look tactile -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#E4E4E7" stroke-width="8" stroke-opacity="0.1"/>
  
  <!-- Icon in the center: A clean, stylized Document with a highlighter tag -->
  <g transform="translate(128, 112)">
    <!-- Document Base Sheet -->
    <path d="M40 0 H180 L256 76 V256 C256 270 244 288 230 288 H40 C26 288 16 274 16 260 V28 C16 14 26 0 40 0 Z" fill="#FFFFFF"/>
    <!-- Folded Corner -->
    <path d="M180 0 V76 H256 Z" fill="#E4E4E7"/>
    
    <!-- Lined rows representing text/composition -->
    <rect x="48" y="120" width="160" height="16" rx="8" fill="#1A1A1A"/>
    <rect x="48" y="160" width="160" height="16" rx="8" fill="#1A1A1A"/>
    <rect x="48" y="200" width="110" height="16" rx="8" fill="#1A1A1A"/>
    
    <!-- Accent Highlighter Mark (Tactile Brutalist touch) -->
    <!-- Neon Yellow highlighter underline on the first line -->
    <rect x="40" y="132" width="176" height="10" fill="#FDE047" opacity="0.6"/>
  </g>
</svg>